# Free Render instances sleep after 15 idle minutes. This keeps the demo awake 5am to 9pm US Pacific,
# when judges are most likely to open it, and stays inside the free plan's monthly hours.
name: keepalive
on:
  schedule:
    - cron: "*/10 13-23,0-4 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 https://dibs-1j5d.onrender.com/api/health
